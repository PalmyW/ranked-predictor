name: Aggregate Team Season Stats

on:
  schedule:
    # Weekly Sunday 10:00 UTC = 8pm AEST (UTC+10)
    # Note: runs at 9pm during AEDT (Oct–Apr, UTC+11)
    - cron: '0 10 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Aggregate team season stats
        run: npm run aggregate-stats

      - name: Format team stats with prettier
        run: |
          shopt -s nullglob
          files=(public/data/2026/team-stats/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write 'public/data/2026/team-stats/*.json'
          fi

      - name: Aggregate AFLW team season stats
        run: node scripts/aggregate-team-stats.js --league=aflw

      - name: Format AFLW team stats with prettier
        run: |
          shopt -s nullglob
          files=(public/data/aflw/2026/team-stats/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write 'public/data/aflw/2026/team-stats/*.json'
          fi

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/2026/team-stats/ public/data/aflw/2026/team-stats/
          git diff --staged --quiet || git commit -m "chore: aggregate team season stats"
          git push

      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
