name: Build and Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch fixture data
        run: |
          curl -fsSL \
            -H 'accept: */*' \
            -H 'account: afl' \
            -H 'origin: https://www.afl.com.au' \
            -H 'referer: https://www.afl.com.au/' \
            -H 'user-agent: Mozilla/5.0 (compatible; ranked-predictor-ci/1.0)' \
            'https://aflapi.afl.com.au/afl/v2/matches?pageSize=300&competitionId=1&compSeasonId=85' \
            -o public/data/2026/fixture.json

      - name: Fetch AFLW fixture data
        run: |
          mkdir -p public/data/aflw/2026
          curl -fsSL \
            -H 'accept: */*' \
            -H 'account: afl' \
            -H 'origin: https://www.afl.com.au' \
            -H 'referer: https://www.afl.com.au/' \
            -H 'user-agent: Mozilla/5.0 (compatible; ranked-predictor-ci/1.0)' \
            'https://aflapi.afl.com.au/afl/v2/matches?pageSize=300&competitionId=3&compSeasonId=96' \
            -o public/data/aflw/2026/fixture.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
