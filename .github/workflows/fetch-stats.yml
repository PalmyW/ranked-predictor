name: Fetch Player Stats

on:
  schedule:
    # Every 5 min Thu–Sun during game hours (01:00–13:00 UTC = 11am–11pm AEST)
    - cron: '*/5 1-13 * * 4,5,6,0'
    # Hourly Mon–Wed
    - cron: '0 * * * 1,2,3'
    # Hourly Thu–Sun outside game hours
    - cron: '0 0,14-23 * * 4,5,6,0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Health check existing stats (delete files missing rating points, re-import missing ratings data)
        run: npm run health-check

      - name: Fetch player stats for concluded matches
        run: npm run fetch-stats

      - name: Format stats with prettier
        run: |
          shopt -s nullglob
          files=(public/data/2026/stats/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write 'public/data/2026/stats/*.json'
          fi

      - name: Aggregate team season stats
        run: npm run aggregate-stats

      - name: Format team stats with prettier
        run: |
          shopt -s nullglob
          files=(public/data/2026/team-stats/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write 'public/data/2026/team-stats/*.json'
          fi

      - name: Health check existing AFLW stats
        run: node scripts/health-check.js --league=aflw

      - name: Fetch AFLW player stats for concluded matches
        run: node scripts/fetch-stats.js --league=aflw

      - name: Format AFLW stats with prettier
        run: |
          shopt -s nullglob
          files=(public/data/aflw/2026/stats/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write 'public/data/aflw/2026/stats/*.json'
          fi

      - name: Aggregate AFLW team season stats
        run: node scripts/aggregate-team-stats.js --league=aflw

      - name: Format AFLW team stats with prettier
        run: |
          shopt -s nullglob
          files=(public/data/aflw/2026/team-stats/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write 'public/data/aflw/2026/team-stats/*.json'
          fi

      - name: Commit stats to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/2026/stats/ public/data/2026/team-stats/ public/data/2026/match-details/ public/data/players/ \
                  public/data/aflw/2026/stats/ public/data/aflw/2026/team-stats/ public/data/aflw/2026/match-details/ public/data/aflw/players/
          git diff --staged --quiet || git commit -m "chore: fetch player stats, match details, and player profiles"
          git push

      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
