name: Fetch Player Stats

on:
  schedule:
    # Every 5 min Thu–Sun during game hours (01:00–13:00 UTC = 11am–11pm AEST)
    - cron: '*/5 1-13 * * 4,5,6,0'
    # Hourly Mon–Wed
    - cron: '0 * * * 1,2,3'
    # Hourly Thu–Sun outside game hours
    - cron: '0 0,14-23 * * 4,5,6,0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch player stats for concluded matches
        env:
          AFL_STATS_TOKEN: ${{ secrets.AFL_STATS_TOKEN }}
        run: |
          mkdir -p public/data/stats
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');

            const data = JSON.parse(fs.readFileSync('public/data/fixture.json', 'utf8'));
            const matches = data.matches || [];
            const concluded = matches.filter(m =>
              m.status === 'CONCLUDED' || m.status === 'POSTGAME'
            );

            let fetched = 0;
            for (const match of concluded) {
              const id = match.providerId;
              if (!id) continue;
              const outFile = 'public/data/stats/' + id + '.json';
              if (fs.existsSync(outFile)) continue;

              console.log('Fetching stats for', id);
              try {
                execSync(
                  'curl -fsSL' +
                  ' -H \"accept: */*\"' +
                  ' -H \"origin: https://www.afl.com.au\"' +
                  ' -H \"referer: https://www.afl.com.au/\"' +
                  ' -H \"user-agent: Mozilla/5.0 (compatible; ranked-predictor-ci/1.0)\"' +
                  ' -H \"x-media-mis-token: ' + process.env.AFL_STATS_TOKEN + '\"' +
                  ' \"https://api.afl.com.au/cfs/afl/playerStats/match/' + id + '\"' +
                  ' -o ' + outFile,
                  { stdio: 'inherit' }
                );
                fetched++;
              } catch (e) {
                console.error('Failed to fetch stats for', id, e.message);
                if (fs.existsSync(outFile)) fs.unlinkSync(outFile);
              }
            }
            console.log('Fetched', fetched, 'new stats files.');
          "

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Format stats with prettier
        run: |
          shopt -s nullglob
          files=(public/data/stats/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            npx prettier --write 'public/data/stats/*.json'
          fi

      - name: Commit stats to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stats/
          git diff --staged --quiet || git commit -m "chore: fetch player stats"
          git push

      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
