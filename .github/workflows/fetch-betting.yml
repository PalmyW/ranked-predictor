name: Fetch Betting Data

on:
  # Schedule disabled: aussportsbetting.com is geo-blocked to Australia, so
  # this fails on GitHub's (non-AU) hosted runners. Run `npm run fetch-betting
  # -- --latest` locally instead.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-betting:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Fetch betting data for newly-concluded matches
        run: npm run fetch-betting -- --latest

      - name: Commit betting data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/2026/match-details/
          git diff --staged --quiet || git commit -m "chore: fetch betting data"
          git push

      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
