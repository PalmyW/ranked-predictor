name: Fetch AFL Data

on:
  schedule:
    # All times UTC. AFL games Thu–Sun (AEST UTC+10, AEDT UTC+11 Mar–Apr)
    # After arvo games (~1:45pm start, finish ~3:45pm → 6am UTC)
    - cron: '0 6 * * 6,0'    # Sat & Sun 6am UTC
    # After afternoon games (~4:35pm start, finish ~6:35pm → 9am UTC)
    - cron: '0 9 * * 6,0'    # Sat & Sun 9am UTC
    # After night games (~7:25pm start, finish ~9:30pm → 12pm UTC next day)
    - cron: '0 12 * * 5,6,0,1' # Fri Sat Sun Mon noon UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch fixture
        run: |
          curl -fsSL \
            -H 'accept: */*' \
            -H 'account: afl' \
            -H 'origin: https://www.afl.com.au' \
            -H 'referer: https://www.afl.com.au/' \
            -H 'user-agent: Mozilla/5.0 (compatible; ranked-predictor-ci/1.0)' \
            'https://aflapi.afl.com.au/afl/v2/matches?pageSize=300&competitionId=1&compSeasonId=85' \
            -o public/data/fixture.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Commit fixture to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/fixture.json
          git diff --staged --quiet || git commit -m "chore: update AFL fixture data"
          git push
