name: Fetch AFL Data

on:
  schedule:
    # Every 5 min Thu–Sun during game hours (01:00–13:00 UTC = 11am–11pm AEST)
    - cron: '*/5 1-13 * * 4,5,6,0'
    # Hourly Mon–Wed
    - cron: '0 * * * 1,2,3'
    # Hourly Thu–Sun outside game hours
    - cron: '0 0,14-23 * * 4,5,6,0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch fixture
        run: |
          curl -fsSL \
            -H 'accept: */*' \
            -H 'account: afl' \
            -H 'origin: https://www.afl.com.au' \
            -H 'referer: https://www.afl.com.au/' \
            -H 'user-agent: Mozilla/5.0 (compatible; ranked-predictor-ci/1.0)' \
            'https://aflapi.afl.com.au/afl/v2/matches?pageSize=300&competitionId=1&compSeasonId=85' \
            -o public/data/2026/fixture.json

      - name: Write timestamp
        run: echo "{\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/data/2026/last-updated.json

      - name: Fetch AFLW fixture
        run: |
          mkdir -p public/data/aflw/2026
          curl -fsSL \
            -H 'accept: */*' \
            -H 'account: afl' \
            -H 'origin: https://www.afl.com.au' \
            -H 'referer: https://www.afl.com.au/' \
            -H 'user-agent: Mozilla/5.0 (compatible; ranked-predictor-ci/1.0)' \
            'https://aflapi.afl.com.au/afl/v2/matches?pageSize=300&competitionId=3&compSeasonId=96' \
            -o public/data/aflw/2026/fixture.json

      - name: Write AFLW timestamp
        run: echo "{\"updatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/data/aflw/2026/last-updated.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Format fixture with prettier
        run: npx prettier --write public/data/2026/fixture.json public/data/aflw/2026/fixture.json

      - run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Commit fixture to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/2026/fixture.json public/data/2026/last-updated.json public/data/aflw/2026/fixture.json public/data/aflw/2026/last-updated.json
          git diff --staged --quiet || git commit -m "chore: update AFL/AFLW fixture data"
          git push
